<article
  class="hero-card"
  style="
    position: relative;
    overflow: hidden;
    background: #07090f;
  "
>

  <!-- Gaming Background Image -->
  <img
    src="2.png"
    alt="OXCINOB Gaming Setup"
    style="
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      z-index: 0;
      opacity: 0.72;
    "
  >

  <!-- Dark Overlay -->
  <div
    style="
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(5,7,15,.98) 0%,
          rgba(5,7,15,.82) 38%,
          rgba(5,7,15,.35) 72%,
          rgba(5,7,15,.12) 100%
        );
      z-index: 1;
    "
  ></div>


  <!-- Hero Content -->
  <div
    class="hero-content"
    style="
      position: relative;
      z-index: 2;
    "
  >

    <div class="eyebrow">
      FEATURED GAMING STORY
    </div>


    <h1>
      Level up your

      <span class="gradient">
        gaming.
      </span>
    </h1>


    <p class="hero-text">
      Discover useful gaming guides, practical tips,
      gaming news, reviews and original content
      created for players.
    </p>


    <div class="hero-meta">

      <span>
        OXCINOB EDITORIAL
      </span>

      <span>•</span>

      <span>
        8 MIN READ
      </span>

      <span>•</span>

      <span>
        AUG 2026
      </span>

    </div>


    <div class="hero-buttons">

      <a
        href="#guides"
        class="btn-primary"
      >
        EXPLORE GUIDES →
      </a>


      <a
        href="news.html"
        class="btn-secondary"
      >
        LATEST NEWS
      </a>

    </div>

  </div>

</article>
